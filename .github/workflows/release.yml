name: Release

# Push a tag like v1.0.0 and this builds Chest-Tracker.exe and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version in the code
        shell: bash
        run: |
          code_version=$(python -c "from version import VERSION; print(VERSION)")
          if [ "v$code_version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} doesn't match version.py ($code_version). Change VERSION, commit, and tag again."
            exit 1
          fi
      - name: Check the release notes were updated
        shell: bash
        run: grep -q "^## ${{ github.ref_name }}\b" RELEASE_NOTES.md || { echo "RELEASE_NOTES.md has no '## ${{ github.ref_name }}' section."; exit 1; }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: powershell -ExecutionPolicy Bypass -File build.ps1
        env:
          REQUIRE_SCANNER: "1"
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release text is this version's section of RELEASE_NOTES.md.
          awk -v tag="## ${{ github.ref_name }}" '$0 ~ "^"tag"([ ]|$)" {on=1; next} /^## / {on=0} on' RELEASE_NOTES.md > notes.md
          gh release create "${{ github.ref_name }}" Chest-Tracker.exe --notes-file notes.md --title "${{ github.ref_name }}"
